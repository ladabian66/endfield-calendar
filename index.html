<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行动日程 // OPERATIONS CALENDAR</title>
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="行动日程">
<link rel="icon" type="image/png" href="endfield-icon.png">
<link rel="apple-touch-icon" href="endfield-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F4F2;
  --board:#FFFFFF;
  --ink:#161616;
  --yellow:#FFFA00;
  --mag:#E6218F;
  --mint:#17C964;
  --line:rgba(22,22,22,.18);
  --ink60:rgba(22,22,22,.62);
  --ink35:rgba(22,22,22,.35);
  --ink12:rgba(22,22,22,.12);
  --cut:12px;
  --snap:cubic-bezier(.16,1,.3,1);
  --mech:cubic-bezier(.7,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0 !important}
html{background:var(--paper)}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.latin{font-family:'Saira','Arial Narrow',sans-serif;font-stretch:112%;font-variant-numeric:tabular-nums}
.latin-wide{font-stretch:125%}

/* ---------- background contour texture ---------- */
.contour{position:fixed;inset:0;pointer-events:none;z-index:0}
.contour svg{position:absolute;width:340px;height:340px;opacity:.09}
.contour .c-tl{top:-90px;left:-90px}
.contour .c-br{bottom:-110px;right:-110px}

/* ---------- dark command bar ---------- */
.cmdbar{
  position:relative;z-index:5;
  background:var(--ink);color:#EDEDED;
  height:52px;display:flex;align-items:center;gap:24px;
  padding:0 28px;
  font-size:12px;
  animation:barDown .38s var(--mech) both;
}
@keyframes barDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.cmdbar .sys{display:flex;align-items:baseline;gap:12px;min-width:0}
.cmdbar .sys .name{font-family:'Saira',sans-serif;font-stretch:125%;font-weight:800;letter-spacing:.14em;font-size:14px}
.cmdbar .sys .sub{font-family:'Saira',sans-serif;font-stretch:112%;font-weight:400;letter-spacing:.14em;color:rgba(237,237,237,.5);font-size:10px;white-space:nowrap}
.seg{display:flex;gap:2px;margin:0 auto}
.seg button{
  appearance:none;border:0;cursor:pointer;
  background:transparent;color:rgba(237,237,237,.75);
  font-family:'Saira','Noto Sans SC',sans-serif;font-stretch:112%;font-weight:600;
  letter-spacing:.14em;font-size:11px;text-transform:uppercase;
  padding:7px 18px;position:relative;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);
  transition:color .15s var(--snap);
}
.seg button small{font-family:'Noto Sans SC';font-weight:700;margin-left:8px;letter-spacing:.2em}
.seg button.on{background:var(--yellow);color:var(--ink)}
.cmdbar .clock{margin-left:auto;font-family:'Saira',sans-serif;font-stretch:112%;font-weight:600;letter-spacing:.14em;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cmdbar .clock .lbl{color:rgba(237,237,237,.45);margin-right:10px;font-weight:400}
@media(max-width:760px){.cmdbar .sys .sub,.cmdbar .clock .lbl{display:none}.cmdbar{gap:12px;padding:0 16px}}

/* ---------- tri-color bar ---------- */
.tri{position:relative;z-index:5;height:3px;display:flex;animation:triIn .42s var(--mech) .1s both}
.tri i{flex:1}
.tri i:nth-child(1){background:var(--mag)}
.tri i:nth-child(2){background:var(--yellow)}
.tri i:nth-child(3){background:var(--mint)}
@keyframes triIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tri{transform-origin:left}

/* ---------- page ---------- */
.page{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:44px 36px 64px}
@media(max-width:760px){.page{padding:28px 16px 48px}}

/* header */
.hd{animation:rise .5s var(--snap) .16s both}
.eyebrow{
  font-family:'Saira',sans-serif;font-stretch:125%;font-weight:600;
  letter-spacing:.14em;font-size:13px;text-transform:uppercase;color:var(--ink);
}
.hd h1{
  font-weight:900;font-size:clamp(40px,6vw,72px);line-height:1.06;
  letter-spacing:.04em;margin-top:10px;
}
.hd h1 .hollow{
  color:transparent;-webkit-text-stroke:1.5px var(--ink);
  font-family:'Saira',sans-serif;font-stretch:125%;font-weight:900;letter-spacing:.02em;
}
.fields{
  margin-top:18px;display:flex;flex-wrap:wrap;gap:0;
  font-family:'Saira','Noto Sans SC',sans-serif;font-stretch:112%;
  font-size:12px;letter-spacing:.1em;color:var(--ink60);
  animation:rise .5s var(--snap) .24s both;
}
.fields span{padding:0 14px;border-left:1px solid var(--line)}
.fields span:first-child{padding-left:0;border-left:0}
.fields b{color:var(--ink);font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* section label */
.sec{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  margin:52px 0 20px;
  animation:rise .5s var(--snap) .3s both;
}
.sec .t .eyebrow{font-size:11px}
.sec .t h2{font-weight:900;font-size:26px;letter-spacing:.08em;margin-top:6px}
.sec .meta{font-family:'Saira',sans-serif;font-stretch:112%;font-size:11px;letter-spacing:.14em;color:var(--ink60)}

/* ---------- calendar board ---------- */
.board{
  background:var(--board);border:1px solid var(--line);
  padding:26px 26px 20px;
  animation:rise .55s var(--snap) .34s both;
}
.months{display:grid;grid-template-columns:1fr 1fr;gap:34px}
@media(max-width:900px){.months{grid-template-columns:1fr}}
.month .mh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.month .mh .mn{font-family:'Saira',sans-serif;font-stretch:125%;font-weight:900;font-size:22px;letter-spacing:.06em}
.month .mh .mn em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--ink60);margin-left:12px}
.month .mh .cnt{font-family:'Saira',sans-serif;font-stretch:112%;font-size:11px;letter-spacing:.14em;color:var(--ink60)}
.grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  background:var(--line);gap:1px;border:1px solid var(--line);
}
.wd{
  background:var(--ink);color:var(--paper);
  font-family:'Saira','Noto Sans SC',sans-serif;font-stretch:112%;
  font-size:10px;letter-spacing:.2em;font-weight:600;text-align:center;padding:5px 0;
}
.cell{
  background:var(--board);min-height:74px;padding:5px 6px 4px;
  position:relative;overflow:hidden;
  transition:background .2s var(--snap);
}
.cell .dnum{
  font-family:'Saira',sans-serif;font-stretch:112%;font-weight:600;font-size:12px;
  display:inline-block;padding:0 5px;line-height:18px;
}
.cell.pad{background:var(--paper)}
.cell.pad .dnum{color:var(--ink35);font-weight:400}
.cell.past .dnum{color:var(--ink35)}
.cell.past{background-image:repeating-linear-gradient(45deg,rgba(22,22,22,.05) 0 1px,transparent 1px 8px)}
.cell.wknd .dnum{color:var(--ink)}
.cell.today{background:var(--yellow)}
.cell.today .dnum{background:var(--ink);color:var(--yellow)}
.cell.has-ev .dnum{background:var(--yellow);color:var(--ink);font-weight:800}
.cell.today.has-ev .dnum{background:var(--ink);color:var(--yellow)}
.ev-chip{
  display:block;margin-top:4px;font-size:10px;font-weight:700;line-height:1.3;
  border-left:2px solid var(--ink);padding:1px 4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(22,22,22,.05);
}
.cell.pin{outline:2px solid var(--ink);outline-offset:-2px;z-index:2}

/* ---------- record rows ---------- */
.rows{border-top:1px solid var(--ink)}
.row{
  display:grid;grid-template-columns:86px 128px 1fr auto;gap:18px;align-items:center;
  padding:14px 6px 14px 0;border-bottom:1px solid var(--line);
  position:relative;cursor:pointer;
  opacity:0;transform:translateY(14px);
  animation:rowIn .45s var(--snap) forwards;
  transition:transform .18s var(--snap);
}
@keyframes rowIn{to{opacity:1;transform:translateY(0)}}
.row::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--yellow);
  transform:scaleY(0);transform-origin:top;transition:transform .16s var(--mech);
}
.row:hover::before{transform:scaleY(1)}
.row:hover{transform:translateX(6px)}
.row .no{
  justify-self:start;background:var(--ink);color:var(--paper);
  font-family:'Saira',sans-serif;font-stretch:112%;font-weight:700;font-size:12px;
  padding:3px 10px 3px 8px;letter-spacing:.08em;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);
}
.row .dt{font-family:'Saira',sans-serif;font-stretch:112%;font-weight:800;font-size:17px;letter-spacing:.04em}
.row .dt small{display:block;font-weight:500;font-size:9px;letter-spacing:.18em;color:var(--ink60);margin-top:1px}
.row .nm{font-weight:700;font-size:15px;letter-spacing:.03em}
.row .nm .loc{display:block;font-weight:400;font-size:11px;color:var(--ink60);margin-top:3px;letter-spacing:.05em}
.row .tg{
  font-family:'Saira','Noto Sans SC',sans-serif;font-stretch:112%;
  font-size:10px;letter-spacing:.14em;font-weight:600;
  border:1px solid var(--ink);padding:3px 10px;white-space:nowrap;
}
.row .tg.hot{background:var(--yellow)}
.row.done{opacity:.85}
.row.done .dt,.row.done .nm{color:var(--ink60)}
.row.done .no{background:transparent;color:var(--ink);border:1px solid var(--ink);clip-path:none;padding:2px 9px}
.row.empty{cursor:default;grid-template-columns:1fr;color:var(--ink60);font-size:13px;line-height:1.9}
.row.empty:hover{transform:none}
.row.empty::before{display:none}
@media(max-width:760px){
  .row{grid-template-columns:70px 1fr;grid-auto-rows:auto}
  .row .tg{display:none}
  .row .dt{grid-column:1}
  .row .nm{grid-column:2;grid-row:1 / span 2}
}

.note{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--board);border:1px solid var(--ink);
  padding:14px 16px;font-size:13px;line-height:1.9;margin-top:18px;
  animation:rise .5s var(--snap) .5s both;
}
.note::before{content:'';flex:0 0 10px;height:14px;background:var(--yellow);border:1px solid var(--ink);margin-top:5px}

/* footer */
.ft{
  margin-top:44px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-family:'Saira','Noto Sans SC',sans-serif;font-stretch:112%;
  font-size:10px;letter-spacing:.14em;color:var(--ink60);
  animation:rise .5s var(--snap) .6s both;
}

/* view toggle */
.view{display:none}
.view.on{display:block;animation:shutter .3s var(--mech) both}
@keyframes shutter{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<div class="contour" aria-hidden="true">
  <svg class="c-tl" viewBox="0 0 200 200" fill="none" stroke="#161616" stroke-width="1.4">
    <path d="M30 120 C20 70 70 25 125 32 C180 39 205 95 178 140 C151 185 80 190 45 155 C18 128 22 96 40 78"/>
    <path d="M55 118 C48 82 84 50 124 55 C164 60 182 100 162 132 C142 164 92 168 66 142 C46 122 50 100 62 88"/>
    <path d="M80 116 C76 94 98 74 124 78 C150 82 160 106 147 125 C134 144 102 146 86 131 C74 119 77 106 84 98"/>
  </svg>
  <svg class="c-br" viewBox="0 0 200 200" fill="none" stroke="#161616" stroke-width="1.4">
    <path d="M170 80 C180 130 130 175 75 168 C20 161 -5 105 22 60 C49 15 120 10 155 45 C182 72 178 104 160 122"/>
    <path d="M145 82 C152 118 116 150 76 145 C36 140 18 100 38 68 C58 36 108 32 134 58 C154 78 150 100 138 112"/>
    <path d="M120 84 C124 106 102 126 76 122 C50 118 40 94 53 75 C66 56 98 54 114 69 C126 81 123 94 116 102"/>
  </svg>
</div>

<header class="cmdbar">
  <div class="sys">
    <span class="name">EF-CAL.SYS</span>
    <span class="sub">// OPERATIONS TERMINAL</span>
  </div>
  <nav class="seg" role="tablist">
    <button class="on" id="tabCal" role="tab" aria-selected="true">CALENDAR<small>日历</small></button>
    <button id="tabList" role="tab" aria-selected="false">RECORDS<small>清单</small></button>
  </nav>
  <div class="clock"><span class="lbl">SYNC</span><span id="clock">--</span></div>
</header>
<div class="tri"><i></i><i></i><i></i></div>

<main class="page">
  <div class="hd">
    <div class="eyebrow">// NOV — DEC 2026 · OPERATIONS CALENDAR</div>
    <h1>行动日程 <span class="hollow">SCHEDULE</span></h1>
    <div class="fields">
      <span>RANGE <b>2026.11.01 — 12.31</b></span>
      <span>UPCOMING <b id="fUp">0</b></span>
      <span>DONE <b id="fDone">0</b></span>
      <span>CITIES <b id="fCities">—</b></span>
      <span>SRC <b>FEISHU CAL</b></span>
    </div>
  </div>

  <section class="view on" id="viewCal">
    <div class="sec">
      <div class="t">
        <div class="eyebrow">// GRID</div>
        <h2>双月视图</h2>
      </div>
      <div class="meta" id="gridMeta">2 MONTHS / 61 DAYS</div>
    </div>
    <div class="board">
      <div class="months">
        <div class="month" id="m0"></div>
        <div class="month" id="m1"></div>
      </div>
    </div>
    <div class="note" id="calNote" hidden></div>
  </section>

  <section class="view" id="viewList">
    <div class="sec">
      <div class="t">
        <div class="eyebrow">// RECORDS</div>
        <h2>活动清单</h2>
      </div>
      <div class="meta" id="listMeta">0 RECORDS</div>
    </div>
    <div class="rows" id="rows"></div>
  </section>

  <footer class="ft">
    <span>UNOFFICIAL DESIGN TRIBUTE · NO GAME ASSETS USED</span>
    <span id="sync">SYNCED —</span>
  </footer>
</main>

<script>
/* ================= DATA =================
   d  : YYYY-MM-DD 开始日期
   e  : YYYY-MM-DD 结束日期(可选,含当天)
   nm : 活动名称    loc: 地点    tg : 标签
========================================= */
const EVENTS = [
  { d:"2026-10-31", e:"2026-11-01", t:"09:00", nm:"枫客松 · 南京首场文旅主题黑客松", loc:"南京 · 栖霞山风景区", tg:"HACKATHON" },
  { d:"2026-11-01", t:"09:00", nm:"「锦创杯」青年黑客松 Day 2", loc:"成都 · 锦创源创享OPC社区(净居寺)", tg:"HACKATHON" },
  { d:"2026-11-03", t:"20:00", nm:"第七期 AI 硬件训练营 · 优秀学员分享 2", loc:"线上 · 飞书视频会议", tg:"TALK" },
  { d:"2026-11-06", t:"12:30", nm:"Panda Jam · 成都科幻周 AI 游戏创作聚会", loc:"成都 · 成都传媒·白鹭湾科创园", tg:"GAME JAM" },
  { d:"2026-11-13", t:"15:00", nm:"刘慈欣 × WaytoAGI 科梦OPC社区见面会", loc:"成都 · 传媒·白鹭湾科创园4栋", tg:"MEETUP" },
  { d:"2026-11-14", t:"14:00", nm:"AI 游戏的下一种可能 · 线下 Demo Day", loc:"成都 · 双流中海财富中心", tg:"DEMO DAY" }
  /* DATA_SLOT */
];
const TODAY = new Date();
const WD = ['一','二','三','四','五','六','日'];
const MONTHS = [[2026,10],[2026,11]]; // 0-based: Nov, Dec

const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const day0 = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
const isDone = ds => new Date(ds + 'T00:00:00') < day0;
const evOn = ds => EVENTS.filter(ev => {
  const s = ev.d, e = ev.e || ev.d;
  return ds >= s && ds <= e;
});

/* ---------- clock ---------- */
function tick(){
  const n = new Date();
  const wk = ['SUN','MON','TUE','WED','THU','FRI','SAT'][n.getDay()];
  document.getElementById('clock').textContent =
    `${n.getFullYear()}.${pad(n.getMonth()+1)}.${pad(n.getDate())} ${wk} ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
}
tick(); setInterval(tick, 1000);

/* ---------- calendar grid ---------- */
function renderMonth(idx, y, m){
  const host = document.getElementById('m'+idx);
  const first = new Date(y, m, 1);
  const dim = new Date(y, m+1, 0).getDate();
  const off = (first.getDay() + 6) % 7; // monday-first
  const nameEn = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][m];
  let evCount = 0;

  let html = `<div class="mh">
    <div class="mn latin-wide">${nameEn}<em>${y}</em></div>
    <div class="cnt" data-cnt></div>
  </div>
  <div class="grid">`;
  WD.forEach(w => html += `<div class="wd">${w}</div>`);

  const total = off + dim;
  const cells = Math.ceil(total / 7) * 7;
  for(let i = 0; i < cells; i++){
    const dn = i - off + 1;
    if(dn < 1 || dn > dim){
      html += `<div class="cell pad"><span class="dnum">${dn < 1 ? '' : ''}</span></div>`;
      continue;
    }
    const d = new Date(y, m, dn);
    const ds = dstr(d);
    const evs = evOn(ds);
    evCount += evs.length;
    const isToday = ds === dstr(TODAY);
    const isPast = d < new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
    const wknd = d.getDay() === 0 || d.getDay() === 6;
    let cls = 'cell';
    if(isPast) cls += ' past';
    if(wknd && !isPast) cls += ' wknd';
    if(isToday) cls += ' today';
    if(evs.length) cls += ' has-ev';
    let chips = '';
    evs.slice(0,2).forEach(ev => chips += `<span class="ev-chip" data-pin="${ev.d}|${ev.e||ev.d}">${ev.nm}</span>`);
    if(evs.length > 2) chips += `<span class="ev-chip" data-pin="${evs[0].d}">+${evs.length-2} MORE</span>`;
    html += `<div class="${cls}" data-day="${ds}"><span class="dnum">${dn}</span>${chips}</div>`;
  }
  html += '</div>';
  host.innerHTML = html;
  host.querySelector('[data-cnt]').textContent = `${evCount} EVENT${evCount===1?'':'S'}`;
}

MONTHS.forEach((mm, i) => renderMonth(i, mm[0], mm[1]));

/* ---------- record rows ---------- */
function renderRows(){
  const host = document.getElementById('rows');
  const list = [...EVENTS].sort((a,b) => a.d.localeCompare(b.d));
  const doneN = list.filter(ev => isDone(ev.d)).length;
  document.getElementById('fUp').textContent = list.length - doneN;
  document.getElementById('fDone').textContent = doneN;
  document.getElementById('listMeta').textContent = `${list.length} RECORD${list.length===1?'':'S'}`;
  const cities = [...new Set(list.map(e => (e.loc||'').split(/[ ,,]/)[0]).filter(x => x && x !== '线上'))];
  document.getElementById('fCities').textContent = cities.length ? cities.join(' / ') : '—';

  const note = document.getElementById('calNote');
  if(list.length && doneN === list.length){
    const last = [...list].sort((a,b)=> (b.e||b.d).localeCompare(a.e||a.d))[0];
    const ld = last.e || last.d;
    note.hidden = false;
    note.textContent = `暂无即将到来的活动 — 同步正常。最近一场是 ${ld.replace(/-/g,'.')} 的「${last.nm}」。下次报名后告诉我,我会同步进这张日历。`;
  } else { note.hidden = true; }

  if(!list.length){
    host.innerHTML = `<div class="row empty" style="animation-delay:.05s">
      暂无即将到来的活动记录 — 完成飞书授权同步后,这里会列出你日历中的活动;点击记录行可在日历中高亮对应日期。</div>`;
    return;
  }
  host.innerHTML = list.map((ev, i) => {
    const d = new Date(ev.d + 'T00:00:00');
    const wk = ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
    const md = s => s.slice(5).replace(/-/g,'.');
    const multi = ev.e && ev.e !== ev.d;
    const range = multi ? md(ev.d) : ev.d.replace(/-/g,'.');
    const done = isDone(ev.d);
    const tag = done ? 'COMPLETED' : (ev.tg || 'SCHEDULED');
    const tm = ev.t ? ` · ${ev.t}` : '';
    const sub = (multi ? ` → ${md(ev.e)} · ` : '') + `${wk}${tm}`;
    return `<div class="row${done ? ' done' : ''}" style="animation-delay:${.05 + i*.045}s" data-pin="${ev.d}|${ev.e||ev.d}">
      <span class="no">No.${pad(i+1)}</span>
      <span class="dt latin">${range}<small>${sub}</small></span>
      <span class="nm">${ev.nm}<span class="loc">${ev.loc || '地点待定'}</span></span>
      <span class="tg${done ? '' : ' hot'}">${tag}</span>
    </div>`;
  }).join('');
}
renderRows();

/* row hover -> pin calendar day */
document.addEventListener('mouseover', e => {
  const r = e.target.closest('[data-pin]');
  if(!r) return;
  const [s, t] = r.dataset.pin.split('|');
  document.querySelectorAll('.cell.pin').forEach(c => c.classList.remove('pin'));
  document.querySelectorAll('.cell').forEach(c => {
    if(c.dataset.day && c.dataset.day >= s && c.dataset.day <= t) c.classList.add('pin');
  });
});

/* ---------- view toggle ---------- */
const tabCal = document.getElementById('tabCal');
const tabList = document.getElementById('tabList');
function setView(cal){
  tabCal.classList.toggle('on', cal);
  tabList.classList.toggle('on', !cal);
  tabCal.setAttribute('aria-selected', cal);
  tabList.setAttribute('aria-selected', !cal);
  document.getElementById('viewCal').classList.toggle('on', cal);
  document.getElementById('viewList').classList.toggle('on', !cal);
}
tabCal.onclick = () => setView(true);
tabList.onclick = () => setView(false);
if(location.search.includes('view=list')) setView(false);

/* sync stamp */
document.getElementById('sync').textContent =
  'SYNCED ' + `${TODAY.getFullYear()}.${pad(TODAY.getMonth()+1)}.${pad(TODAY.getDate())} ${pad(TODAY.getHours())}:${pad(TODAY.getMinutes())}`;
</script>
</body>
